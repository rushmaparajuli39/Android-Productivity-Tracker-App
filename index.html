<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habit Tracker</title>
  <meta name="description" content="A private, offline habit tracker. Your data stays on your device.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f8f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1413" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <main id="view" tabindex="-1" aria-live="polite"></main>

    <nav class="tabs" aria-label="Main">
      <a href="#/today" data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>
        <span>Today</span>
      </a>
      <a href="#/habits" data-tab="habits">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Habits</span>
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <dialog id="habit-dialog" aria-labelledby="habit-dialog-title">
    <form id="habit-form" method="dialog">
      <h2 id="habit-dialog-title">New habit</h2>

      <label class="field">
        <span>Name</span>
        <input name="name" required maxlength="60" autocomplete="off" placeholder="e.g. Read 20 pages">
      </label>

      <div class="field-row">
        <label class="field emoji-field">
          <span>Emoji</span>
          <input name="emoji" maxlength="8" autocomplete="off" placeholder="📚">
        </label>
        <fieldset class="field">
          <legend>Color</legend>
          <div class="swatches" id="swatches"></div>
        </fieldset>
      </div>

      <fieldset class="field">
        <legend>Repeat on</legend>
        <div class="days" id="day-toggles"></div>
      </fieldset>

      <label class="field">
        <span>Reminder time <small>(optional)</small></span>
        <input name="reminder" type="time">
        <small class="hint">After saving, open the habit and tap “Add reminder to calendar” so your phone reminds you.</small>
      </label>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-action="close-dialog">Cancel</button>
        <button type="submit" class="btn primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
